# Alembic configuration.
#
# sqlalchemy.url is intentionally left blank: migrations/env.py sets it from
# violence_etl.settings so the same history runs on SQLite and PostgreSQL.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Set from the environment at runtime; do not hard-code a URL here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
